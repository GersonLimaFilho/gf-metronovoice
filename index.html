<body><main class="app">
<header class="brand"><img class="brand-logo" src="assets/gf-metronovoice-logo.png" alt="GF MetronoVoice"><small>SUA VOZ. SEU TEMPO.</small></header>
<section class="panel tempo"><div class="label">Andamento</div><div class="bpm" id="bpmText">80 <span>BPM</span></div>
<div class="controls"><button class="circle" id="minus5" aria-label="Diminuir 5 BPM">−5</button><button class="circle" id="minus1" aria-label="Diminuir 1 BPM">−</button><button class="circle" id="plus1" aria-label="Aumentar 1 BPM">+</button><button class="circle" id="plus5" aria-label="Aumentar 5 BPM">+5</button></div>
<input id="bpmRange" class="tempoInput" type="range" min="30" max="240" step="1" value="80" aria-label="BPM">
<div class="label" style="margin-top:12px">Compasso 4/4</div><div class="beatrow" aria-label="Indicadores dos tempos"><div class="beat" id="beat0">1</div><div class="beat" id="beat1">2</div><div class="beat" id="beat2">3</div><div class="beat" id="beat3">4</div></div>
<div class="count-zone"><div class="label">Contagem falada</div><div class="subdiv subdiv3"><button class="option selected" data-mode="quarter">1 · 2 · 3 · 4</button><button class="option" data-mode="eighth">1 e 2 e 3 e 4 e</button><button class="option" data-mode="sixteenth">1 i e a</button></div>
<div class="compact-settings"><label>Áudio <select id="audioMode"><option value="voice">Voz</option><option value="click">Clique</option><option value="both">Voz + Clique</option></select></label><label class="precheck"><input type="checkbox" id="precount"> Pré-contagem (1 compasso)</label><label class="precheck"><input type="checkbox" id="accent" checked> Acentuar 1</label></div>
<div class="volumes"><label>Voz <input id="voiceVolume" type="range" min="0" max="100" value="90" aria-label="Volume da voz"></label><label>Clique <input id="clickVolume" type="range" min="0" max="100" value="65" aria-label="Volume do clique"></label></div>
<details class="syllable-details" id="syllableDetails"><summary>♪ Ajustar volume do “i” e do “a”</summary><div class="syllable-volume-row"><label for="iVolume">i <input id="iVolume" type="range" min="0" max="200" step="5" value="100" aria-label="Volume relativo da sílaba i"><output id="iVolumeText" for="iVolume">100%</output></label><label for="aVolume">a <input id="aVolume" type="range" min="0" max="200" step="5" value="100" aria-label="Volume relativo da sílaba a"><output id="aVolumeText" for="aVolume">100%</output></label></div></details></div>
<div class="actions"><button id="play" class="primary">▶ Iniciar</button><button id="stop" class="secondary">■ Parar</button></div><div id="transportStatus" class="status" role="status">Pronto para tocar.</div></section>

<div class="official-label" id="officialVoiceStatus" role="status">● Preparando voz oficial GF…</div>
<p class="footer">GF MetronoVoice · Beta 8 · 4/4 · 30–240 BPM<br>Voz oficial GF integrada · Sem gravação ou login.</p>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const labels=['1','2','3','4','i','e','a'];
let bpm=80,mode='quarter',running=false,ctx=null,nextTime=0,scheduler=null,voiceBuffers={},raf=0,flashQueue=[],eventIndex=0,precountEvents=0,activeSources=new Set();
let voiceReady=null;
const settingsKey='gf-metronovoice-settings-v1';
const status=t=>$('#transportStatus').textContent=t;
const voiceStatus=t=>$('#officialVoiceStatus').textContent=t;
function saveSettings(){try{localStorage.setItem(settingsKey,JSON.stringify({bpm,mode,audioMode:$('#audioMode').value,precount:$('#precount').checked,accent:$('#accent').checked,voiceVolume:$('#voiceVolume').value,clickVolume:$('#clickVolume').value,iVolume:$('#iVolume').value,aVolume:$('#aVolume').value}))}catch(e){}}
function setBpm(v){bpm=Math.max(30,Math.min(240,Math.round(Number(v)||80)));$('#bpmText').innerHTML=bpm+' <span>BPM</span>';$('#bpmRange').value=bpm;saveSettings()}
function setMode(m){mode=m;for(const el of document.querySelectorAll('[data-mode]'))el.classList.toggle('selected',el.dataset.mode===m);saveSettings();if(running){stop();start()}}
$('#bpmRange').oninput=e=>setBpm(e.target.value);[['minus5',-5],['minus1',-1],['plus1',1],['plus5',5]].forEach(([id,n])=>$('#'+id).onclick=()=>setBpm(bpm+n));
for(const bt of document.querySelectorAll('[data-mode]'))bt.onclick=()=>setMode(bt.dataset.mode);
for(const id of ['audioMode','precount','accent','voiceVolume','clickVolume','iVolume','aVolume'])$('#'+id).onchange=saveSettings;
for(const id of ['voiceVolume','clickVolume','iVolume','aVolume'])$('#'+id).oninput=saveSettings;
try{const s=JSON.parse(localStorage.getItem(settingsKey)||'{}');if(s.bpm)setBpm(s.bpm);if(['quarter','eighth','sixteenth'].includes(s.mode)){mode=s.mode;for(const bt of document.querySelectorAll('[data-mode]'))bt.classList.toggle('selected',bt.dataset.mode===mode)}if(['voice','click','both'].includes(s.audioMode))$('#audioMode').value=s.audioMode;if(typeof s.precount==='boolean')$('#precount').checked=s.precount;if(typeof s.accent==='boolean')$('#accent').checked=s.accent;if(s.voiceVolume!==undefined)$('#voiceVolume').value=s.voiceVolume;if(s.clickVolume!==undefined)$('#clickVolume').value=s.clickVolume;if(s.iVolume!==undefined)$('#iVolume').value=s.iVolume;if(s.aVolume!==undefined)$('#aVolume').value=s.aVolume}catch(e){}
function updateSyllableLabels(){for(const id of ['i','a'])$('#'+id+'VolumeText').textContent=$('#'+id+'Volume').value+'%'}
updateSyllableLabels();for(const id of ['iVolume','aVolume'])$('#'+id).addEventListener('input',updateSyllableLabels);
function createCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx}
async function resume(){const c=createCtx();if(c.state!=='running')await c.resume();return c}
async function loadVoices(){const c=createCtx();let loaded=0;
  const problems=[];
  await Promise.all(labels.map(async label=>{try{
    const r=await fetch('assets/vozes/'+label+'.wav?v=7',{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.arrayBuffer();
    voiceBuffers[label]=await c.decodeAudioData(data.slice(0));loaded++;
  }catch(err){problems.push(label+': '+err.message)}}));
  if(problems.length){voiceStatus('⚠ Voz GF incompleta: '+problems.join(', '));throw new Error('Não foi possível carregar todas as vozes. Verifique a pasta assets/vozes no GitHub.');}
  voiceStatus('✓ Voz oficial GF pronta · 7 sílabas');return true;
}
function ensureVoices(){if(!voiceReady)voiceReady=loadVoices().catch(err=>{voiceReady=null;throw err});return voiceReady}
function clickAt(t,strong=false){const amount=Number($('#clickVolume').value)/100;if(amount<=0)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(strong?1320:880,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.25*amount,t+.003);gain.gain.exponentialRampToValueAtTime(.0001,t+.065);osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+.08);activeSources.add(osc);osc.onended=()=>activeSources.delete(osc)}
// Beta 8: preserva a afinação natural das sete gravações.
// A duração é limitada à janela rítmica SEM alterar playbackRate.
// O fade curto suaviza o recorte para evitar embolo e estalos.
function voiceAt(label,t,strong=false){
  const b=voiceBuffers[label];if(!b)return false;
  const base=Number($('#voiceVolume').value)/100;
  const relative=label==='i'?Number($('#iVolume').value)/100:label==='a'?Number($('#aVolume').value)/100:1;
  const amount=base*relative*(strong?1:.91);
  if(amount<=0)return true;
  const windowSeconds=60/bpm/slots();
  const gap=Math.min(.012,windowSeconds*.09);
  const available=Math.max(.025,windowSeconds-gap);
  const duration=Math.min(b.duration,available);
  const attack=Math.min(.0035,duration*.12);
  const release=Math.min(.014,Math.max(.004,duration*.16));
  const src=ctx.createBufferSource(),gain=ctx.createGain();
  src.buffer=b;
  // Taxa original = timbre e altura originais da voz.
  src.playbackRate.setValueAtTime(1,t);
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(amount,t+attack);
  gain.gain.setValueAtTime(amount,Math.max(t+attack,t+duration-release));
  gain.gain.linearRampToValueAtTime(0,t+duration);
  src.connect(gain).connect(ctx.destination);
  src.start(t);src.stop(t+duration+.001);
  activeSources.add(src);src.onended=()=>activeSources.delete(src);
  return true;
}
function speakAt(label,t,strong=false){const choice=$('#audioMode').value;const useVoice=choice!=='click',useClick=choice!=='voice';if(useVoice)voiceAt(label,t,strong);if(useClick)clickAt(t,strong)}
const slots=()=>mode==='sixteenth'?4:mode==='eighth'?2:1;
function note(t,index){const div=slots(),pre=index<precountEvents,offset=pre?index:index-precountEvents,beat=Math.floor(offset/div)%4,sub=offset%div;
  const label=pre?String(beat+1):sub===0?String(beat+1):mode==='eighth'?'e':['','i','e','a'][sub];
  const strong=$('#accent').checked&&beat===0&&sub===0;
  if(!pre||sub===0)speakAt(label,t,strong);
  flashQueue.push({t,beat,isE:sub>0,pre,label});}
function tick(){if(!running)return;const horizon=ctx.currentTime+.14;let guard=0;while(nextTime<horizon&&guard++<48){note(nextTime,eventIndex);nextTime+=60/bpm/slots();eventIndex++;if(eventIndex>=precountEvents+slots()*4)eventIndex=precountEvents}}
function animate(){if(!running)return;while(flashQueue.length&&flashQueue[0].t<=ctx.currentTime+.014){const n=flashQueue.shift();for(let i=0;i<4;i++){const el=$('#beat'+i);el.classList.toggle('active',i===n.beat);el.classList.toggle('eighth',i===n.beat&&n.isE)}status((n.pre?'Pré-contagem: ':'Tocando: ')+n.label+' · '+bpm+' BPM')}raf=requestAnimationFrame(animate)}
async function start(){try{await resume();if(running)return;if($('#audioMode').value!=='click'){status('Carregando voz oficial…');await ensureVoices();}running=true;eventIndex=0;precountEvents=$('#precount').checked?slots()*4:0;nextTime=ctx.currentTime+.07;flashQueue=[];activeSources=new Set();scheduler=setInterval(tick,25);tick();animate();$('#play').textContent='▶ Tocando';status(precountEvents?'Pré-contagem…':'Iniciando…')}catch(e){status('Erro: '+e.message)}}
function stop(){running=false;clearInterval(scheduler);cancelAnimationFrame(raf);flashQueue=[];for(const source of activeSources){try{source.stop()}catch(e){}}activeSources=new Set();for(let i=0;i<4;i++)$('#beat'+i).classList.remove('active','eighth');$('#play').textContent='▶ Iniciar';status('Parado.')}
$('#play').onclick=()=>running?stop():start();$('#stop').onclick=stop;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)stop()});
// Download the voice package silently; audio decoding occurs on first Play to respect Safari activation.
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{}));}
})();
</script></body></html>
